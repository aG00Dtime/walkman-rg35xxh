name: Test app and bundled storage

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the release engine
        run: python tools/verify_native.py
      - name: Install pinned build tools for host tests
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          with urllib.request.urlopen('https://ziglang.org/download/index.json') as response:
              info = json.load(response)['0.15.2']['x86_64-linux']
          with urllib.request.urlopen(info['tarball']) as response:
              data = response.read()
          assert hashlib.sha256(data).hexdigest() == info['shasum'], 'Zig checksum mismatch'
          archive = root / 'zig.tar.xz'
          archive.write_bytes(data)
          subprocess.run(['tar', '-xf', str(archive), '-C', str(root)], check=True)
          PY
          python -m pip install pygame-ce==2.5.8
      - name: Build the same SQLite source for the test runner
        run: >-
          python tools/build_sqlite.py
          --zig "$RUNNER_TEMP/zig-x86_64-linux-0.15.2/zig"
          --target x86_64-linux-gnu.2.17
          --output "$RUNNER_TEMP/walkman-sqlite-host/libwalkman_sqlite3.so"
      - name: Test native storage, migration, fallback, and app behavior
        env:
          WALKMAN_SQLITE_TEST_LIBRARY: ${{ runner.temp }}/walkman-sqlite-host/libwalkman_sqlite3.so
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -v
