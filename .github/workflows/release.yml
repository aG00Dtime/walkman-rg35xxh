name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Walkman app package
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Package the app
        shell: pwsh
        run: ./package.ps1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" walkman-rg35xxh.zip
          --title "Walkman RG35XX H ${{ github.ref_name }}"
          --generate-notes
